name: Oppdater skredsaker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skredmonitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent saker og varsler
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python fetch.py
      - name: Lagre endringer
        run: |
          git config user.name "skredmonitor"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || (git commit -m "Oppdatert data" && git pull --rebase && git push)
