<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skred i Vestland</title>
<meta name="theme-color" content="#14222A">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛰️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EE; --surface:#FFFFFF; --ink:#14222A; --muted:#5B6B73; --line:#CBD3D6;
  --link:#0B5C7A; --new:#0B5C7A;
  --lvl2:#F5C400; --lvl3:#F28A1B; --lvl4:#D6322B;
  --lvl2bg:#FFF8D6; --lvl3bg:#FFEBD3; --lvl4bg:#FBDCDA;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1A20; --surface:#17252D; --ink:#E6ECEE; --muted:#93A3AB; --line:#2C3D46;
    --link:#7CC4E0; --new:#7CC4E0;
    --lvl2bg:#3A3410; --lvl3bg:#3D2A14; --lvl4bg:#40191A;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Public Sans",Roboto,system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
header{padding:22px 0 8px}
h1{margin:0;font-size:1.75rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sub{margin:6px 0 0;color:var(--muted);font-size:.875rem}
.tabs{display:flex;gap:6px;margin:16px 0 4px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.tabs button{flex:1;padding:10px 6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:inherit;font-weight:500;font-size:.9rem;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.tabs .n{opacity:.65;font-weight:400;margin-left:4px}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--link);outline-offset:2px}

h2{font-size:1rem;font-weight:700;margin:22px 0 8px}
.warn{background:var(--surface);border:1px solid var(--line);border-left-width:8px;border-radius:8px;padding:12px 14px;margin:0 0 10px}
.warn.l2{border-left-color:var(--lvl2);background:var(--lvl2bg)}
.warn.l3{border-left-color:var(--lvl3);background:var(--lvl3bg)}
.warn.l4{border-left-color:var(--lvl4);background:var(--lvl4bg)}
.warn strong{display:block;font-size:.95rem}
.warn p{margin:4px 0 0;font-size:.9rem}
.warn .meta{color:var(--muted);font-size:.8rem;margin-top:6px}
.warnnote{color:var(--muted);font-size:.875rem;margin:0 0 6px}

.day{margin:22px 0 6px;font-size:.85rem;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px;text-transform:none}
ul{list-style:none;margin:0;padding:0}
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item a.t{color:var(--ink);font-weight:600;font-size:1.02rem;text-decoration:none;display:block}
.item a.t:hover,.item a.t:focus-visible{color:var(--link);text-decoration:underline}
.meta{color:var(--muted);font-size:.82rem;margin-top:3px}
.meta a{color:var(--muted)}
.badge{display:inline-block;background:var(--new);color:var(--bg);font-size:.7rem;font-weight:700;border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.tag{font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px}

details{margin:14px 0}
summary{cursor:pointer;font-weight:600;font-size:.9rem;padding:6px 0}
.srcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 12px;padding:6px 0}
.srcs label{display:flex;gap:8px;align-items:center;font-size:.875rem;padding:6px 0}
.srcs input{width:18px;height:18px}
.empty{color:var(--muted);padding:24px 0}
.err{background:var(--lvl4bg);border:1px solid var(--lvl4);border-radius:8px;padding:10px 12px;font-size:.9rem;margin-top:12px}
footer{color:var(--muted);font-size:.8rem;margin-top:32px}
footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Skred i Vestland</h1>
    <p class="sub" id="updated">Laster…</p>
  </header>

  <div class="tabs" role="tablist" id="tabs"></div>

  <section id="warnings"></section>

  <details id="srcbox"><summary id="srcsum">Kilder</summary><div class="srcs" id="srcs"></div></details>

  <main id="list"></main>
  <div id="error"></div>

  <footer>
    Saker fra lokale og nasjonale medier via Google Nyheter. Skredvarsler fra
    <a href="https://www.varsom.no/flom-og-jordskred/" rel="noopener">NVE/Varsom</a>.
    Mediene rapporterer ofte etter at noe har skjedd. Sjekk alltid Varsom og
    <a href="https://www.vegvesen.no/trafikk/" rel="noopener">Statens vegvesen</a> for stengte veger.
  </footer>
</div>

<script>
const TABS = [["sf","Sogn og Fjordane"],["ho","Hordaland"],["alle","Alle"]];
const LEVEL = {2:["Gult nivå","l2"],3:["Oransje nivå","l3"],4:["Rødt nivå","l4"]};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let data = {articles:[], warnings:[]};
let tab = store.get("tab","sf");
let hidden = new Set(store.get("hidden",[]));
const lastVisit = store.get("lastVisit", 0);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inTab = regions => tab === "alle" || (regions || []).includes(tab);
const fmtTime = iso => new Date(iso).toLocaleTimeString("nb-NO",{hour:"2-digit",minute:"2-digit"});
const dayKey = iso => new Date(iso).toLocaleDateString("sv-SE");
function dayLabel(iso){
  const d = new Date(iso), now = new Date();
  const k = dayKey(iso);
  if (k === dayKey(now)) return "I dag";
  const y = new Date(now); y.setDate(now.getDate()-1);
  if (k === dayKey(y)) return "I går";
  return d.toLocaleDateString("nb-NO",{weekday:"long",day:"numeric",month:"long"});
}
function fmtValid(w){
  const f = x => x ? new Date(x).toLocaleDateString("nb-NO",{weekday:"short",day:"numeric",month:"short"}) : "";
  return w.valid_from ? `Gjelder ${f(w.valid_from)}${w.valid_to && f(w.valid_to)!==f(w.valid_from) ? " – "+f(w.valid_to) : ""}` : "";
}

function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = TABS.map(([id,label]) => {
    const n = data.articles.filter(a => !hidden.has(a.source) && (id==="alle" || a.regions.includes(id))).length;
    return `<button role="tab" data-tab="${id}" aria-selected="${id===tab}">${label}<span class="n">${n}</span></button>`;
  }).join("");
  el.querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.dataset.tab; store.set("tab",tab); render(); });
}

function renderWarnings(){
  const el = document.getElementById("warnings");
  const ws = (data.warnings || []).filter(w => inTab(w.regions));
  let html = `<h2>Skredvarsler fra NVE</h2>`;
  if (!ws.length){
    html += `<p class="warnnote">Ingen aktive varsler på gult nivå eller høyere for dette området de neste tre dagene. <a href="https://www.varsom.no/flom-og-jordskred/" rel="noopener">Åpne Varsom</a></p>`;
  } else {
    html += ws.map(w => {
      const [name, cls] = LEVEL[w.level] || ["Varsel","l2"];
      return `<div class="warn ${cls}"><strong>${name}: ${esc(w.areas.join(", ") || "Vestland")}</strong>
        ${w.text ? `<p>${esc(w.text)}</p>` : ""}
        <div class="meta">${esc(fmtValid(w))} · <a href="https://www.varsom.no/flom-og-jordskred/varsling/" rel="noopener">Varsom</a></div></div>`;
    }).join("");
  }
  if (data.warnings_error) html += `<div class="err">Kunne ikke hente NVE-varsler sist: ${esc(data.warnings_error)}. Viser siste kjente.</div>`;
  el.innerHTML = html;
}

function renderSources(){
  const counts = {};
  data.articles.forEach(a => counts[a.source] = (counts[a.source]||0)+1);
  const names = Object.keys(counts).sort((a,b) => counts[b]-counts[a] || a.localeCompare(b,"nb"));
  document.getElementById("srcsum").textContent = hidden.size ? `Kilder (${hidden.size} skjult)` : "Kilder";
  document.getElementById("srcs").innerHTML = names.map(n =>
    `<label><input type="checkbox" data-src="${esc(n)}" ${hidden.has(n)?"":"checked"}> ${esc(n)} (${counts[n]})</label>`).join("");
  document.querySelectorAll("#srcs input").forEach(cb => cb.onchange = () => {
    cb.checked ? hidden.delete(cb.dataset.src) : hidden.add(cb.dataset.src);
    store.set("hidden",[...hidden]); render(false);
  });
}

function renderList(){
  const el = document.getElementById("list");
  const items = data.articles.filter(a => !hidden.has(a.source) && inTab(a.regions));
  if (!items.length){ el.innerHTML = `<p class="empty">Ingen skredsaker funnet de siste ukene for dette valget.</p>`; return; }
  let html = "", cur = "";
  for (const a of items){
    const k = dayKey(a.published);
    if (k !== cur){ if (cur) html += "</ul>"; html += `<h3 class="day">${esc(dayLabel(a.published))}</h3><ul>`; cur = k; }
    const isNew = lastVisit && new Date(a.first_seen).getTime() > lastVisit;
    const also = (a.also||[]).filter(o => !hidden.has(o.source)).map(o => `<a href="${esc(o.url)}" rel="noopener">${esc(o.source)}</a>`).join(", ");
    const regionTag = tab==="alle" ? a.regions.filter(r=>r!=="annet").map(r=>`<span class="tag">${r==="sf"?"SF":"HO"}</span>`).join("") : "";
    html += `<li class="item"><a class="t" href="${esc(a.url)}" rel="noopener">${esc(a.title)}</a>
      <div class="meta">${isNew?'<span class="badge">NY</span>':""}${esc(a.source)} · ${fmtTime(a.published)}${regionTag}${also?` · også: ${also}`:""}</div></li>`;
  }
  el.innerHTML = html + "</ul>";
}

function render(all=true){
  renderTabs(); renderWarnings(); renderList();
  if (all) renderSources();
}

fetch("data.json", {cache:"no-store"}).then(r => r.json()).then(d => {
  data = d;
  const t = d.updated ? new Date(d.updated).toLocaleString("nb-NO",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "";
  document.getElementById("updated").textContent = t ? `Data sist endret ${t}` : "Ingen data ennå";
  render();
}).catch(() => {
  document.getElementById("updated").textContent = "Ingen data ennå";
  document.getElementById("error").innerHTML = `<div class="err">Fant ikke data.json. Kjør oppdateringen (GitHub Actions) minst én gang.</div>`;
  render();
});

document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") store.set("lastVisit", Date.now()); });
window.addEventListener("pagehide", () => store.set("lastVisit", Date.now()));
</script>
</body>
</html>
